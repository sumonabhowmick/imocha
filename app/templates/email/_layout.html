<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ app_name }}</title></head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Segoe UI,Arial,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f5f7;padding:24px 0;">
<tr><td align="center">
<table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
<tr><td style="background:#1e3a5f;padding:20px 28px;color:#ffffff;font-size:20px;font-weight:600;">{{ app_name }}</td></tr>
<tr><td style="padding:28px;font-size:15px;line-height:1.55;">

</td></tr>
<tr><td style="padding:16px 28px;background:#f8f9fb;color:#6b7280;font-size:12px;line-height:1.5;">

</table>

</table>

</html>
